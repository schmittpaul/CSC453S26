on:
  workflow_dispatch:
  push:
    branches: main
    paths:
      - "slides/**/*.qmd"
      - "slides/_extensions/**"
      - "slides/images/**"
      - "slides/static/**"

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install decktape
        run: npm install -g decktape@3.15.0

      - name: Render changed slide decks
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            mapfile -t slide_sources < <(find slides -maxdepth 1 -name '*.qmd' | sort)
          else
            mapfile -t changed_files < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- slides)
            if printf '%s\n' "${changed_files[@]}" | grep -vqE '^slides/.+\.qmd$'; then
              mapfile -t slide_sources < <(find slides -maxdepth 1 -name '*.qmd' | sort)
            else
              mapfile -t slide_sources < <(
                printf '%s\n' "${changed_files[@]}" | grep -E '^slides/.+\.qmd$' | sort
              )
            fi
          fi

          if [[ ${#slide_sources[@]} -eq 0 ]]; then
            echo "No slide sources changed; nothing to export."
            exit 0
          fi

          for source in "${slide_sources[@]}"; do
            quarto render "$source" --output-dir slides/docs
            html_path="$(realpath "slides/docs/$(basename "${source%.qmd}").html")"
            html_url="file://$html_path"
            pdf_path="slides/docs/$(basename "${source%.qmd}").pdf"
            decktape reveal \
              --chrome-arg=--allow-file-access-from-files \
              --chrome-arg=--no-sandbox \
              --chrome-arg=--disable-setuid-sandbox \
              "$html_url" \
              "$pdf_path"
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: slides/docs
